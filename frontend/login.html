<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorFix - Iniciar sesión</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="login">
        <h1>MotorFix</h1>
        <p class="subtitulo">Inicia sesión en tu cuenta</p>

        <form id="form-login">
            <div>
                <label for="email">Email: </label>
                <input type="email" name="email" id="email" required>
            </div>
            <div>
                <label for="password">Contraseña: </label>
                <input type="password" name="password" id="password" required>
            </div>

            <!-- Aquí se mostrarán los mensajes de error o de éxito -->
            <p id="mensaje"></p>

            <input type="button" value="Entrar" id="entrar">
        </form>

        <p class="registro">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </main>
</body>
</html>
